{% extends "base.html" %}
{% block title %}Runs - Kiroku{% endblock %}
{% block content %}
<h2>Runs</h2>
<table>
  <thead>
    <tr>
      <th>Schedule</th>
      <th>Kind</th>
      <th>Started</th>
      <th>Finished</th>
      <th>Total</th>
      <th>OK</th>
      <th>Failed</th>
      <th>Status</th>
      <th>Commit</th>
    </tr>
  </thead>
  <tbody>
  {% for b in batches %}
    {% include "runs/_batch_row.html" %}
  {% else %}
    <tr><td colspan="9">No runs yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
