{% extends "base.html" %}
{% block title %}Runs - Kiroku{% endblock %}
{% block content %}
<div class="toolbar">
  <h2 style="margin:0">Runs</h2>
  <button class="help-btn" onclick="openHelp('runs')">? Help</button>
</div>
<table>
  <thead>
    <tr>
      <th>Schedule</th>
      <th>Kind</th>
      <th>Started</th>
      <th>Finished</th>
      <th>Total</th>
      <th>OK</th>
      <th>Failed</th>
      <th>Status</th>
      <th>Commit</th>
    </tr>
  </thead>
  <tbody>
  {% for b in batches %}
    {% include "runs/_batch_row.html" %}
  {% else %}
    <tr><td colspan="9">No runs yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
