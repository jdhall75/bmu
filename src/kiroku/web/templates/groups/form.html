{% extends "base.html" %}
{% block title %}{% if group %}Edit group - Kiroku{% else %}New group - Kiroku{% endif %}{% endblock %}
{% block content %}
<h2>{% if group %}Edit group{% else %}New group{% endif %}</h2>
<form method="post" action="{% if group %}/groups/{{ group.id }}{% else %}/groups{% endif %}">
  <label>Name</label><input type="text" name="name" value="{{ group.name or '' }}" required>
  <label>Description</label><input type="text" name="description" value="{{ group.description or '' }}">
  <label>Default credential</label>
  <select name="default_credential_id">
    <option value=""{% if not group or not group.default_credential_id %} selected{% endif %}>(none)</option>
    {% for c in credentials %}
      <option value="{{ c.id }}"{% if group and group.default_credential_id == c.id %} selected{% endif %}>{{ c.name }}</option>
    {% endfor %}
  </select>
  <label>Max parallel</label><input type="number" name="max_parallel" value="{{ group.max_parallel if group else 8 }}" min="1">

  <label>Worker pool
    <span class="muted" style="font-size:0.8em;font-weight:normal">— route all devices in this group to a specific worker; blank = default pool</span>
  </label>
  <input type="text" name="worker_pool" value="{{ group.worker_pool or '' }}"
         list="pool-suggestions" placeholder="e.g. site-a, dmz (blank = default)">
  <datalist id="pool-suggestions">
    {% for p in worker_pools %}<option value="{{ p }}">{% endfor %}
  </datalist>

  <div class="actions">
    <button type="submit">{% if group %}Save{% else %}Create{% endif %}</button>
    <a class="secondary" role="button" href="/groups">Cancel</a>
  </div>
</form>
{% endblock %}
