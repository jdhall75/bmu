{% extends "base.html" %}
{% block title %}{% if schedule %}Edit schedule - Kiroku{% else %}New schedule - Kiroku{% endif %}{% endblock %}
{% block content %}
<h2>{% if schedule %}Edit schedule{% else %}New schedule{% endif %}</h2>
<form method="post" action="{% if schedule %}/schedules/{{ schedule.id }}{% else %}/schedules{% endif %}">
  <label>Name</label><input type="text" name="name" value="{{ schedule.name or '' }}" required>
  <label>Description</label><input type="text" name="description" value="{{ schedule.description or '' }}">
  <label>Job</label>
  <select name="job_id" required>
    <option value=""{% if not schedule or not schedule.job_id %} selected{% endif %}>(none)</option>
    {% for j in jobs %}
      <option value="{{ j.id }}"{% if schedule and schedule.job_id == j.id %} selected{% endif %}>
        {{ j.name }} ({{ j.kind.value }})
      </option>
    {% endfor %}
  </select>
  <label>Cron expression</label><input type="text" name="cron" value="{{ schedule.cron or '' }}" placeholder="0 3 * * *" required>
  <label>Timezone (IANA)</label><input type="text" name="timezone" value="{{ schedule.timezone or 'UTC' }}">
  <label>Enabled</label><input type="checkbox" name="enabled" value="1"{% if not schedule or schedule.enabled %} checked{% endif %}>
  <div class="actions">
    <button type="submit">{% if schedule %}Save{% else %}Create{% endif %}</button>
    <a class="secondary" role="button" href="/schedules">Cancel</a>
  </div>
</form>
{% endblock %}
