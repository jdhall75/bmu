<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Kiroku{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header>
    <h1><a href="/">Kiroku</a></h1>
    <nav>
      <a href="/groups">Groups</a>
      <a href="/devices">Devices</a>
      <a href="/platforms">Platforms</a>
      <a href="/jobs">Jobs</a>
      <a href="/parsers">Parsers</a>
      <a href="/credentials">Credentials</a>
      <a href="/schedules">Schedules</a>
      <a href="/runs">Runs</a>
      <a href="/cve">CVE Scans</a>
      <a href="/search">Search</a>
      <button class="help-nav-btn" onclick="openHelp('index')" title="Getting started &amp; workflow guide">?</button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% set _ms = elapsed_ms(request) %}
  {% if _ms is not none %}
  <div class="perf-bar">{{ _ms }} ms</div>
  {% endif %}

  <dialog id="help-dialog" class="help-dialog">
    <div class="help-dialog-header">
      <span class="help-dialog-title">Help</span>
      <button class="help-dialog-close" onclick="document.getElementById('help-dialog').close()" title="Close">&times;</button>
    </div>
    <div id="help-body" class="help-dialog-body">
      <p>Loading&hellip;</p>
    </div>
  </dialog>

  <script>
  function openHelp(page) {
    var body = document.getElementById('help-body');
    var dialog = document.getElementById('help-dialog');
    body.innerHTML = '<p class="muted">Loading…</p>';
    dialog.showModal();
    htmx.ajax('GET', '/docs/' + page, {target: '#help-body', swap: 'innerHTML'});
  }
  document.getElementById('help-dialog').addEventListener('click', function(e) {
    if (e.target === this) this.close();
  });
  </script>
</body>
</html>
