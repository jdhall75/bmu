{% extends "base.html" %}
{% block title %}New schedule - BMU{% endblock %}
{% block content %}
<h2>New schedule</h2>
<form method="post" action="/schedules">
  <label>Name</label><input type="text" name="name" required>
  <label>Description</label><input type="text" name="description">
  <label>Group</label>
  <select name="group_id" required>
    {% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
  </select>
  <label>Kind</label>
  <select name="kind" required>
    {% for k in kinds %}<option value="{{ k }}">{{ k }}</option>{% endfor %}
  </select>
  <label>Cron expression</label><input type="text" name="cron" placeholder="0 3 * * *" required>
  <label>Timezone (IANA)</label><input type="text" name="timezone" value="UTC">
  <label>Enabled</label><input type="checkbox" name="enabled" value="1" checked>
  <div class="actions">
    <button type="submit">Create</button>
    <a class="btn btn-secondary" href="/schedules">Cancel</a>
  </div>
</form>
{% endblock %}
