{% extends "base.html" %}
{% block title %}Credentials - BMU{% endblock %}
{% block content %}
<div class="toolbar"><a class="btn" href="/credentials/new">New credential</a></div>
<table>
  <thead><tr><th>Name</th><th>Provider</th><th>Username</th><th>Ref</th></tr></thead>
  <tbody>
  {% for c in credentials %}
    <tr>
      <td>{{ c.name }}</td><td>{{ c.provider.value }}</td>
      <td>{{ c.username or '-' }}</td><td>{{ c.ref or '-' }}</td>
    </tr>
  {% else %}
    <tr><td colspan="4">No credentials.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
