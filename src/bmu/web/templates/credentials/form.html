{% extends "base.html" %}
{% block title %}{% if credential %}Edit credential - BMU{% else %}New credential - BMU{% endif %}{% endblock %}
{% block content %}
<h2>{% if credential %}Edit credential{% else %}New credential{% endif %}</h2>
<form method="post" action="{% if credential %}/credentials/{{ credential.id }}{% else %}/credentials{% endif %}">
  <label>Name</label><input type="text" name="name" value="{{ credential.name if credential else '' }}" required>
  <label>Description</label><input type="text" name="description" value="{{ credential.description if credential else '' }}">
  <label>Provider</label>
  <select name="provider" required>
    {% for p in providers %}
      <option value="{{ p }}"{% if credential and credential.provider.value == p %} selected{% endif %}>{{ p }}</option>
    {% endfor %}
  </select>
  <label>Username</label><input type="text" name="username" value="{{ credential.username if credential else '' }}">
  <label>Password (local only{% if credential %}, leave blank to keep current{% endif %})</label><input type="password" name="password">
  <label>Enable / secondary (local only{% if credential %}, leave blank to keep current{% endif %})</label><input type="password" name="enable_password">
  <label>Reference (vault/bitwarden)</label><input type="text" name="ref" value="{{ credential.ref if credential else '' }}" placeholder="secret/bmu/cisco-edge">
  <div class="actions">
    <button type="submit">{% if credential %}Save{% else %}Create{% endif %}</button>
    <a class="btn btn-secondary" href="/credentials">Cancel</a>
  </div>
</form>
{% endblock %}
