{% extends "base.html" %}
{% block title %}New credential - BMU{% endblock %}
{% block content %}
<h2>New credential</h2>
<form method="post" action="/credentials">
  <label>Name</label><input type="text" name="name" required>
  <label>Description</label><input type="text" name="description">
  <label>Provider</label>
  <select name="provider" required>
    {% for p in providers %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
  </select>
  <label>Username</label><input type="text" name="username">
  <label>Password (local only)</label><input type="text" name="password">
  <label>Enable / secondary (local only)</label><input type="text" name="enable_password">
  <label>Reference (vault/bitwarden)</label><input type="text" name="ref" placeholder="secret/bmu/cisco-edge">
  <div class="actions">
    <button type="submit">Create</button>
    <a class="btn btn-secondary" href="/credentials">Cancel</a>
  </div>
</form>
{% endblock %}
