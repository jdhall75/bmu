{% extends "base.html" %}
{% block title %}{% if profile %}Edit profile - BMU{% else %}New profile - BMU{% endif %}{% endblock %}
{% block content %}
<h2>{% if profile %}Edit profile{% else %}New profile{% endif %}</h2>
<form method="post" action="{% if profile %}/profiles/{{ profile.id }}{% else %}/profiles{% endif %}">
  <label>Name</label><input type="text" name="name" value="{{ profile.name if profile else '' }}" required>
  <label>Description</label><input type="text" name="description" value="{{ profile.description if profile else '' }}">
  <label>Kind</label>
  <select name="kind" required>
    {% for k in kinds %}
      <option value="{{ k }}"{% if profile and profile.kind.value == k %} selected{% endif %}>{{ k }}</option>
    {% endfor %}
  </select>

  <label>Platform (CLI)</label>
  <select name="platform">
    <option value=""{% if not profile or not profile.platform %} selected{% endif %}>(none)</option>
    <optgroup label="Core">
      {% for p in platforms %}
        <option value="{{ p }}"{% if profile and profile.platform == p %} selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </optgroup>
    <optgroup label="Community">
      {% for p in community_platforms %}
        <option value="{{ p }}"{% if profile and profile.platform == p %} selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </optgroup>
  </select>
  <label>Transport</label>
  <select name="transport">
    <option value=""{% if not profile or not profile.transport %} selected{% endif %}>(default)</option>
    {% for t in transports %}
      <option value="{{ t }}"{% if profile and profile.transport and profile.transport.value == t %} selected{% endif %}>{{ t }}</option>
    {% endfor %}
  </select>
  <label>Port</label><input type="number" name="port" value="{{ profile.port if profile and profile.port else '' }}">
  <label>Prompt pattern (generic only)</label><input type="text" name="prompt_pattern" value="{{ profile.prompt_pattern if profile else '' }}" placeholder="e.g. ^.*[#>]\s*$">
  <label>Pre-commands (one per line)</label><textarea name="pre_commands" placeholder="enable&#10;terminal length 0">{{ profile.pre_commands if profile else '' }}</textarea>
  <label>Disable paging command</label><input type="text" name="disable_paging_command" value="{{ profile.disable_paging_command if profile else '' }}">
  <label>Commands (one per line)</label><textarea name="commands" placeholder="show running-config">{{ profile.commands if profile else '' }}</textarea>

  <label>Manufacturer (NETCONF)</label><input type="text" name="manufacturer" value="{{ profile.manufacturer if profile else '' }}">
  <label>RPC (NETCONF)</label><textarea name="rpc">{{ profile.rpc if profile else '' }}</textarea>

  <label>Parser template</label>
  <select name="parser_template_id">
    <option value=""{% if not profile or not profile.parser_template_id %} selected{% endif %}>(none)</option>
    {% for t in parsers %}
      <option value="{{ t.id }}"{% if profile and profile.parser_template_id == t.id %} selected{% endif %}>{{ t.name }} ({{ t.type.value }})</option>
    {% endfor %}
  </select>

  <div class="actions">
    <button type="submit">{% if profile %}Save{% else %}Create{% endif %}</button>
    <a class="btn btn-secondary" href="/profiles">Cancel</a>
  </div>
</form>
{% endblock %}
