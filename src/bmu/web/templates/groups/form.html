{% extends "base.html" %}
{% block title %}New group - BMU{% endblock %}
{% block content %}
<h2>New group</h2>
<form method="post" action="/groups">
  <label>Name</label><input type="text" name="name" required>
  <label>Description</label><input type="text" name="description">
  <label>Default credential</label>
  <select name="default_credential_id">
    <option value="">(none)</option>
    {% for c in credentials %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
  </select>
  <label>Max parallel</label><input type="number" name="max_parallel" value="8" min="1">
  <div class="actions">
    <button type="submit">Create</button>
    <a class="btn btn-secondary" href="/groups">Cancel</a>
  </div>
</form>
{% endblock %}
