[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiroku"
version = "0.1.0"
description = "Kiroku - distributed network device backup and data collection"
requires-python = ">=3.11"
dependencies = [
    # Shared by all services
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "croniter>=2.0",
    "click>=8.1",
    "structlog>=24.1",
    "httpx>=0.27",
    "GitPython>=3.1",
    "cryptography>=43.0",
    "textfsm>=1.1",
    "parse>=1.20",
]

[project.optional-dependencies]
web = [
    "litestar[jinja,standard]>=2.12",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
]
worker = [
    "scrapli2>=2.0.0rc7",
    "ttp>=0.9",
    "lxml>=5.2",
    "hvac>=2.3",
    "bitwarden-sdk>=1.0; python_version<'4'",
]

[project.scripts]
kiroku = "kiroku.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kiroku = ["web/templates/**/*.html", "web/static/**/*", "web/docs/**/*.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
