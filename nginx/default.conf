server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    # Redirect bare root to kiroku
    # location = / {
    #     return 302 /kiroku/;
    # }

    # kiroku — strip /kiroku prefix before forwarding
    location /kiroku/ {
        set $kiroku_upstream "kiroku-web";
        proxy_pass         http://$kiroku_upstream:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # checkr — strip /checkr prefix before forwarding
    location /checkr/ {
        set $checkr_upstream "checkr-web";
        proxy_pass         http://$checkr_upstream:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
